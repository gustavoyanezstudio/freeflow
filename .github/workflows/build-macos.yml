# ---------------------------------------------------------------------------
# Compila freeflow y secretflow para macOS y arma los .dmg, en un runner de
# GitHub. No hace falta tener un Mac.
#
# Genera DOS versiones por edición:
#   freeflow.dmg / secretflow.dmg
#       Universal (Apple Silicon nativa + Intel). Intel: macOS 10.13+.
#       Apple Silicon: macOS 12+ (el ffmpeg arm64 no baja de 12).
#   freeflow-legacy.dmg / secretflow-legacy.dmg
#       Solo Intel (x86_64), macOS 10.13+. En Apple Silicon corre con
#       Rosetta 2 (macOS lo pide instalar la primera vez).
#
# Cómo usarlo:
#   1) Subí este proyecto a un repositorio de GitHub.
#   2) Pestaña "Actions" → "Build macOS DMG" → "Run workflow".
#   3) Cuando termina, bajá los .dmg desde "Artifacts".
#
# (También se dispara solo si empujás un tag tipo v1.0.1)
# ---------------------------------------------------------------------------
name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14            # runner Apple Silicon
    permissions:
      contents: write            # para publicar la Release al empujar un tag
    env:
      PY: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
    steps:
      - uses: actions/checkout@v4

      # Python universal2 de python.org (soporta macOS 10.13+ en Intel y
      # Apple Silicon nativo; el instalador es "for macOS 10.13 and later").
      - name: Instalar Python universal2
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          sudo installer -pkg python-3.12.7-macos11.pkg -target /

      - name: Dependencias
        run: |
          "$PY" -VV
          "$PY" -m pip install --upgrade pip pyinstaller yt-dlp imageio-ffmpeg

      # El ffmpeg de imageio ya no arranca en macOS viejo (pide 11/12). Se arma:
      #   bin/ffmpeg        -> universal (arm64 de imageio + x86_64 de evermeet)
      #   bin/ffmpeg-legacy -> x86_64 solo (evermeet, macOS 10.13+)
      - name: Preparar ffmpeg
        run: |
          set -eux
          mkdir -p bin
          ARM="$( "$PY" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())' )"
          URL="$( curl -fsSL https://evermeet.cx/ffmpeg/info/ffmpeg/release \
                  | "$PY" -c 'import sys,json; print(json.load(sys.stdin)["download"]["zip"]["url"])' )"
          curl -fsSL -o /tmp/evermeet.zip "$URL"
          rm -rf /tmp/evermeet && mkdir -p /tmp/evermeet
          unzip -o /tmp/evermeet.zip -d /tmp/evermeet >/dev/null
          X86="$( find /tmp/evermeet -type f -name ffmpeg | head -1 )"
          [ -n "$X86" ]
          chmod +x "$ARM" "$X86"
          cp "$X86" bin/ffmpeg-legacy
          lipo -create -output bin/ffmpeg "$ARM" "$X86"
          chmod +x bin/ffmpeg bin/ffmpeg-legacy
          echo "universal: $(lipo -archs bin/ffmpeg)"
          echo "legacy:    $(lipo -archs bin/ffmpeg-legacy)"

      - name: Íconos .icns
        run: |
          set -e
          mk_icns() {
            d="icon.iconset"; rm -rf "$d"; mkdir -p "$d"
            for n in 16 32 128 256 512; do
              sips -z $n $n "$1" --out "$d/icon_${n}x${n}.png" >/dev/null
              sips -z $((n*2)) $((n*2)) "$1" --out "$d/icon_${n}x${n}@2x.png" >/dev/null
            done
            iconutil -c icns "$d" -o "$2"; rm -rf "$d"
          }
          mk_icns freeflow.png freeflow.icns
          mk_icns secretflow.png secretflow.icns

      # ----------------------- versión universal2 -----------------------
      - name: PyInstaller (universal2)
        env:
          FF_ARCH: universal2
        run: |
          "$PY" -m PyInstaller --noconfirm --clean freeflow_macos.spec
          "$PY" -m PyInstaller --noconfirm --clean secretflow_macos.spec

      - name: Verificar versiones (universal2)
        run: bash scripts/verificar_minos.sh "universal2"

      - name: Armar los .dmg (universal2)
        run: |
          for app in freeflow secretflow; do
            stage="dist/dmg_$app"; rm -rf "$stage" "dist/$app.dmg"; mkdir -p "$stage"
            cp -R "dist/$app.app" "$stage/"
            cp "README_$app.txt" "$stage/"
            hdiutil create -volname "$app" -srcfolder "$stage" -ov -format UDZO "dist/$app.dmg"
            rm -rf "$stage"
          done
          rm -rf dist/freeflow.app dist/secretflow.app

      # -------------------- versión legacy (solo Intel) --------------------
      - name: PyInstaller (legacy, solo Intel x86_64)
        env:
          FF_ARCH: x86_64
          FF_ETIQUETA: legacy
        run: |
          cp bin/ffmpeg-legacy bin/ffmpeg
          "$PY" -m PyInstaller --noconfirm --clean freeflow_macos.spec
          "$PY" -m PyInstaller --noconfirm --clean secretflow_macos.spec

      - name: Verificar versiones (legacy)
        run: bash scripts/verificar_minos.sh "legacy"

      - name: Armar los .dmg (legacy)
        run: |
          for app in freeflow secretflow; do
            stage="dist/dmg_$app"; rm -rf "$stage" "dist/$app-legacy.dmg"; mkdir -p "$stage"
            cp -R "dist/$app legacy.app" "$stage/"
            cp "README_$app.txt" "$stage/"
            hdiutil create -volname "$app legacy" -srcfolder "$stage" -ov -format UDZO "dist/$app-legacy.dmg"
            rm -rf "$stage"
          done
          ls -lh dist/*.dmg

      - name: Subir DMGs de freeflow
        uses: actions/upload-artifact@v4
        with:
          name: freeflow-macos-dmg
          path: |
            dist/freeflow.dmg
            dist/freeflow-legacy.dmg
          if-no-files-found: error

      - name: Subir DMGs de secretflow
        uses: actions/upload-artifact@v4
        with:
          name: secretflow-macos-dmg
          path: |
            dist/secretflow.dmg
            dist/secretflow-legacy.dmg
          if-no-files-found: error

      - name: Publicar Release (solo al empujar un tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/freeflow.dmg
            dist/secretflow.dmg
            dist/freeflow-legacy.dmg
            dist/secretflow-legacy.dmg
