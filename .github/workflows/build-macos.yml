# ---------------------------------------------------------------------------
# Compila freeflow y secretflow para macOS (.app universal2) y arma los .dmg,
# en un runner macOS de GitHub. No hace falta tener un Mac.
#
# Cómo usarlo:
#   1) Subí este proyecto a un repositorio de GitHub.
#   2) Pestaña "Actions" → "Build macOS DMG" → "Run workflow".
#   3) Cuando termina, bajá los .dmg desde "Artifacts".
#
# (También se dispara solo si empujás un tag tipo v1.0)
# ---------------------------------------------------------------------------
name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14            # runner Apple Silicon
    permissions:
      contents: write            # para publicar la Release al empujar un tag
    env:
      PY: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
    steps:
      - uses: actions/checkout@v4

      # Python universal2 de python.org (así la app corre en Apple Silicon e Intel)
      - name: Instalar Python universal2
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          sudo installer -pkg python-3.12.7-macos11.pkg -target /

      - name: Dependencias
        run: |
          "$PY" -VV
          "$PY" -m pip install --upgrade pip pyinstaller yt-dlp imageio-ffmpeg

      # Se descargan los ffmpeg de cada arquitectura y se unen con lipo -> universal
      - name: ffmpeg universal (arm64 + x86_64)
        run: |
          set -eux
          mkdir -p bin
          ARM="$("$PY" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p /tmp/ffx/w
          if "$PY" -m pip download --only-binary=:all: --no-deps \
               --platform macosx_10_9_x86_64 --python-version 3.12 \
               --implementation cp --abi none \
               imageio-ffmpeg -d /tmp/ffx; then
            (cd /tmp/ffx/w && unzip -o /tmp/ffx/*.whl >/dev/null)
            X86="$(find /tmp/ffx/w -type f -name 'ffmpeg-macos-x86_64*' | head -1)"
            lipo -create -output bin/ffmpeg "$ARM" "$X86"
          else
            echo "AVISO: no pude bajar el ffmpeg x86_64; la app queda sólo arm64."
            cp "$ARM" bin/ffmpeg
          fi
          chmod +x bin/ffmpeg
          file bin/ffmpeg

      - name: Íconos .icns
        run: |
          set -e
          mk_icns() {
            d="icon.iconset"; rm -rf "$d"; mkdir -p "$d"
            for n in 16 32 128 256 512; do
              sips -z $n $n "$1" --out "$d/icon_${n}x${n}.png" >/dev/null
              sips -z $((n*2)) $((n*2)) "$1" --out "$d/icon_${n}x${n}@2x.png" >/dev/null
            done
            iconutil -c icns "$d" -o "$2"; rm -rf "$d"
          }
          mk_icns freeflow.png freeflow.icns
          mk_icns secretflow.png secretflow.icns

      - name: PyInstaller (universal2)
        env:
          FF_ARCH: universal2
        run: |
          "$PY" -m PyInstaller --noconfirm --clean freeflow_macos.spec
          "$PY" -m PyInstaller --noconfirm --clean secretflow_macos.spec

      # Muestra la arquitectura y el macOS mínimo real de CADA rodaja de cada binario.
      - name: Verificar versión mínima de macOS
        run: |
          set -e
          minos_of() { otool -arch "$2" -l "$1" 2>/dev/null | awk '
              /LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}
              /LC_VERSION_MIN_MACOSX/{v=1} v&&/^ *version/{print $2; exit}'; }
          x86="0.0"; arm="0.0"
          for app in freeflow secretflow; do
            echo "== $app.app =="
            while IFS= read -r f; do
              archs="$(lipo -archs "$f" 2>/dev/null)" || continue
              [ -n "$archs" ] || continue
              line="  ${f#dist/} [$(echo $archs | tr ' ' ',')]"
              for a in $archs; do
                m="$(minos_of "$f" "$a")"
                [ -n "$m" ] || continue
                line="$line ${a}=${m}"
                if [ "$a" = "x86_64" ]; then x86="$(printf '%s\n%s\n' "$x86" "$m" | sort -V | tail -1)"; fi
                if [ "$a" = "arm64" ];  then arm="$(printf '%s\n%s\n' "$arm" "$m" | sort -V | tail -1)"; fi
              done
              echo "$line"
            done < <(find "dist/$app.app" -type f)
            echo "  Info.plist LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "dist/$app.app/Contents/Info.plist")"
          done
          echo "bin/ffmpeg: archs=$(lipo -archs bin/ffmpeg 2>/dev/null || echo '?')"
          echo "== PEOR minos  x86_64=macOS $x86   arm64=macOS $arm =="

      - name: Armar los .dmg
        run: |
          for app in freeflow secretflow; do
            stage="dist/dmg_$app"; rm -rf "$stage" "dist/$app.dmg"; mkdir -p "$stage"
            cp -R "dist/$app.app" "$stage/"
            cp "README_$app.txt" "$stage/"
            hdiutil create -volname "$app" -srcfolder "$stage" -ov -format UDZO "dist/$app.dmg"
            rm -rf "$stage"
          done
          ls -lh dist/*.dmg

      - name: Subir freeflow.dmg
        uses: actions/upload-artifact@v4
        with:
          name: freeflow-macos-dmg
          path: dist/freeflow.dmg
          if-no-files-found: error

      - name: Subir secretflow.dmg
        uses: actions/upload-artifact@v4
        with:
          name: secretflow-macos-dmg
          path: dist/secretflow.dmg
          if-no-files-found: error

      - name: Publicar Release (solo al empujar un tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/freeflow.dmg
            dist/secretflow.dmg
